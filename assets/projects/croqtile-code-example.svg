<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 424" font-family="'Menlo','Consolas','Monaco','Liberation Mono',monospace" font-size="9">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="cheader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#2a2a3c"/>
    </linearGradient>
  </defs>
  <rect width="560" height="424" rx="8" fill="url(#cbg)"/>
  <rect width="560" height="26" rx="8" fill="url(#cheader)"/>
  <rect y="18" width="560" height="8" fill="url(#cheader)"/>
  <circle cx="14" cy="13" r="4.5" fill="#f38ba8"/>
  <circle cx="28" cy="13" r="4.5" fill="#f9e2af"/>
  <circle cx="42" cy="13" r="4.5" fill="#a6e3a1"/>
  <text x="280" y="17" text-anchor="middle" fill="#bac2de" font-size="9">matmul_f16_warpspec_1p1c.co</text>

  <g transform="translate(0,36)">
    <text x="8" y="11"><tspan fill="#cba6f7" font-weight="600">__co__</tspan><tspan fill="#89b4fa"> void</tspan><tspan fill="#f9e2af"> matmul</tspan><tspan fill="#bac2de">(</tspan><tspan fill="#89b4fa">global</tspan><tspan fill="#a6e3a1"> f16</tspan><tspan fill="#bac2de"> [M,K] lhs, </tspan><tspan fill="#89b4fa">global</tspan><tspan fill="#a6e3a1"> f16</tspan><tspan fill="#bac2de"> [N,K] rhs, </tspan><tspan fill="#89b4fa">global</tspan><tspan fill="#a6e3a1"> f16</tspan><tspan fill="#bac2de"> [M,N] out) {</tspan></text>

    <text x="19" y="23" fill="#cba6f7">parallel<tspan fill="#bac2de"> {block_m, block_n} by [cdiv(M,WM), cdiv(N,WN)] : </tspan><tspan fill="#89b4fa">block</tspan><tspan fill="#bac2de"> {</tspan></text>

    <text x="30" y="37" fill="#89b4fa">shared event<tspan fill="#bac2de"> </tspan><tspan fill="#f9e2af">full</tspan><tspan fill="#bac2de">[STAGES], </tspan><tspan fill="#f9e2af">empty</tspan><tspan fill="#bac2de">[STAGES];</tspan></text>
    <text x="30" y="49" fill="#89b4fa">shared<tspan fill="#a6e3a1"> f16</tspan><tspan fill="#bac2de"> [STAGES*WM, TK] lhs_load_s;</tspan></text>
    <text x="30" y="61" fill="#89b4fa">shared<tspan fill="#a6e3a1"> f16</tspan><tspan fill="#bac2de"> [STAGES*WN, TK] rhs_load_s;</tspan></text>
    <text x="30" y="73" fill="#89b4fa">shared<tspan fill="#a6e3a1"> f16</tspan><tspan fill="#bac2de"> [WM, WN] output_s;</tspan></text>

    <text x="30" y="89" fill="#cba6f7">parallel<tspan fill="#bac2de"> p1 by 2 : </tspan><tspan fill="#89b4fa">group-4</tspan><tspan fill="#bac2de">, t by 128 : </tspan><tspan fill="#89b4fa">thread</tspan><tspan fill="#bac2de"> {</tspan></text>

    <text x="41" y="105" fill="#bac2de">inthreads.async (p1 == 0 &amp;&amp; t == 0) {<tspan fill="#6c7086">        // Producer</tspan></text>
    <text x="52" y="117" fill="#bac2de">foreach {iv_k} in [cdiv(K, TK)] {</text>
    <text x="63" y="129" fill="#bac2de">stage = iv_k % STAGES;</text>
    <text x="63" y="141" fill="#bac2de">wait <tspan fill="#f9e2af">empty</tspan>[stage];</text>
    <text x="63" y="153"><tspan fill="#f9e2af">tma.copy.async</tspan><tspan fill="#bac2de">&lt;</tspan><tspan fill="#f9e2af">full</tspan><tspan fill="#bac2de">[stage]&gt;.swiz&lt;SWIZ&gt;</tspan></text>
    <text x="74" y="165" fill="#bac2de">lhs.subspan(WM, TK).at(block_m, iv_k)</text>
    <text x="74" y="177" fill="#bac2de">=&gt; lhs_load_s.subspan(WM, TK).at(stage, 0);</text>
    <text x="63" y="189"><tspan fill="#f9e2af">tma.copy.async</tspan><tspan fill="#bac2de">&lt;</tspan><tspan fill="#f9e2af">full</tspan><tspan fill="#bac2de">[stage]&gt;.swiz&lt;SWIZ&gt;</tspan></text>
    <text x="74" y="201" fill="#bac2de">rhs.chunkat(block_n, iv_k)</text>
    <text x="74" y="213" fill="#bac2de">=&gt; rhs_load_s.subspan(WN, TK).at(stage, 0);</text>
    <text x="63" y="225" fill="#bac2de">trigger <tspan fill="#f9e2af">full</tspan>[stage]; } }</text>

    <text x="41" y="241" fill="#bac2de">inthreads.async (p1 == 1) {<tspan fill="#6c7086">                  // Consumer</tspan></text>
    <text x="52" y="253" fill="#bac2de">mc = <tspan fill="#f9e2af">mma.fill.f16</tspan> 0.0f;</text>
    <text x="52" y="265" fill="#bac2de">foreach {s} in [STAGES] { trigger <tspan fill="#f9e2af">empty</tspan>[s]; }</text>
    <text x="52" y="277" fill="#bac2de">foreach {iv_k} in [cdiv(K, TK)] {</text>
    <text x="63" y="289" fill="#bac2de">stage = iv_k % STAGES; wait <tspan fill="#f9e2af">full</tspan>[stage];</text>
    <text x="63" y="301" fill="#bac2de">foreach {iv} in [cdiv(TK, WK)] {</text>
    <text x="74" y="313" fill="#bac2de">ma = <tspan fill="#f9e2af">mma.load</tspan>.swiz&lt;SWIZ&gt; lhs_load_s...chunkat(_, iv);</text>
    <text x="74" y="325" fill="#bac2de">mb = <tspan fill="#f9e2af">mma.load</tspan>.swiz&lt;SWIZ&gt; rhs_load_s...chunkat(_, iv);</text>
    <text x="74" y="337" fill="#bac2de"><tspan fill="#f9e2af">mma.row.row</tspan> mc, ma, mb; }</text>
    <text x="63" y="349" fill="#bac2de"><tspan fill="#f9e2af">mma.commit</tspan>; trigger <tspan fill="#f9e2af">empty</tspan>[stage]; }</text>
    <text x="52" y="361" fill="#bac2de"><tspan fill="#f9e2af">mma.store</tspan> mc, output_s;</text>
    <text x="52" y="373" fill="#bac2de"><tspan fill="#f9e2af">tma.copy</tspan> output_s =&gt; output.subspan(WM,WN).at(block_m,block_n);</text>
    <text x="41" y="385" fill="#bac2de">} } } }</text>
  </g>
</svg>
